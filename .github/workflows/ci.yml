# 最小 CI：推送 / PR 时跑离线单测（geo_captcha + slider_captcha 共 6 个测试文件）
# 本地同命令验证：29 例全绿（2026-10-05，python 3.14 / numpy 2.5 / cv2 5.0）
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 系统依赖（opencv-python 的 libGL + 点选题所需中文字体）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 fonts-noto-cjk

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行离线单测
        run: python -m unittest discover -s tests -v
